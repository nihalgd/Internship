<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notes App</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app">
<header><div><span>LOCAL STORAGE</span><h1>My Notes</h1></div><button id="clearAll">Clear All</button></header>
<section class="editor"><input id="title" placeholder="Note title"><textarea id="content" placeholder="Write your note..."></textarea><button id="save">Save Note</button></section>
<section><h2>Saved Notes</h2><div id="notes"></div></section>
</main>
<script src="script.js"></script>
</body></html>
