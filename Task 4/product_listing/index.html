<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Product Listing</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a href="#" class="logo">Marketly</a><div><select id="category"><option value="all">All Categories</option><option value="Tech">Tech</option><option value="Office">Office</option><option value="Lifestyle">Lifestyle</option></select><select id="sort"><option value="default">Sort: Default</option><option value="priceLow">Price: Low to High</option><option value="priceHigh">Price: High to Low</option><option value="rating">Rating: High to Low</option></select></div></header>
<main><section class="intro"><span>PRODUCT LISTING</span><h1>Find what fits your workflow.</h1><p>Filter products by category and sort them by price or rating.</p></section><section id="products" class="grid"></section></main>
<script src="script.js"></script>
</body></html>
